-dontoptimize
-dontobfuscate
-keepattributes SourceFile,LineNumberTable
-keep class org.whispersystems.** { *; }
-keep class org.signal.libsignal.net.** { *; }
-keep class org.signal.libsignal.protocol.** { *; }
-keep class org.signal.libsignal.usernames.** { *; }
-keep class org.thoughtcrime.securesms.** { *; }
# [Smartt] Our code lives outside org.thoughtcrime.securesms, so the keep rule above does not cover
# it. The communication-window DTOs are constructed and read only by Jackson reflection, which R8
# cannot see; without this it strips their constructors, fields and getters and every window
# request/response silently fails in release builds (debug is unminified, so it looks fine there).
-keep class com.smarttmessenger.** { *; }
# [/Smartt]
-keep class org.signal.donations.json.** { *; }
-keepclassmembers class ** {
    public void onEvent*(**);
}

# Protobuf lite
-keep class * extends com.google.protobuf.GeneratedMessageLite { *; }

-keep class androidx.window.** { *; }

-keepclassmembers class * extends androidx.constraintlayout.motion.widget.Key {
  public <init>();
}

# AGP generated dont warns
-dontwarn com.android.org.conscrypt.SSLParametersImpl
-dontwarn org.apache.harmony.xnet.provider.jsse.SSLParametersImpl
-dontwarn org.slf4j.impl.StaticLoggerBinder
-dontwarn sun.net.spi.nameservice.NameService
-dontwarn sun.net.spi.nameservice.NameServiceDescriptor